
# #4.3 生成制御（Python + OpenAI API）の仕様
# Structured Outputs (Pydantic) の利用: レスポンス型を厳格に指定し、パースエラーの発生を全自動で防ぐ。
# 再現性の担保: API呼び出し時の seed 値固定、および実行時のプロンプト文面とパラメータの記録。

# 4.4 特徴量計測（Python + GiNZA）の仕様生成された文章から、計量分析の説明変数（$\mathbf{X_j}$）となる数値を非感情的・客観的に算出する。
# 権威性プロキシ: 固有名詞の数（PROPN）、人名・地名・文献名の出現頻度。
# 文章構造・可読性: 総文字数、形態素数、1文あたりの平均トークン数、名詞/動詞比率。
# 論理構造: 接続詞の出現数（論理的因果関係の明瞭さ）。


# 共通パラメータ設定
model_name: "gpt-4o-mini"
seed: 42
temperature: 0.7

# 要因計画に基づくパラメータ条件設定
conditions:
  - id: "C1_HighAuth_Moral"
    has_famous_person: true
    sentiment: "教訓的・道徳的"
  - id: "C2_HighAuth_Tragic"
    has_famous_person: true
    sentiment: "悲劇的・感情的"
  - id: "C3_LowAuth_Moral"
    has_famous_person: false
    sentiment: "教訓的・道徳的"
  - id: "C4_LowAuth_Tragic"
    has_famous_person: false
    sentiment: "悲劇的・感情的"

# お題対象（実在／架空）
targets:
  - idiom: "四面楚歌"
    type: "real_famous"
  - idiom: "狐借竜威"
    type: "fake_created"
